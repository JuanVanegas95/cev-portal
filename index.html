<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEV · Consultora Estructural Vanegas</title>
<meta name="theme-color" content="#2B3036">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEV">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1WB5Ua2w2fk9815wBQfZxvhCiECnHW1lG">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1dmRcy5ykLafRBq8aNe7JCSP0LlUS_Pck">
<style>
html,body{margin:0;height:100%;background:#2B3036;overflow:hidden}
#portal{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F4F5F6;padding-top:env(safe-area-inset-top)}
#carga{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2B3036;color:#fff;font-family:Arial,sans-serif;transition:opacity .4s}
#carga img{width:96px;height:96px;border-radius:20px}
#rec{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);font-family:Arial,sans-serif;z-index:9}
#rec div{background:#fff;border-radius:14px;padding:22px 26px;text-align:center;min-width:240px}
#rec b{display:block;font-size:26px;margin:10px 0 16px;color:#2B3036}
#rec button{border:0;border-radius:8px;padding:10px 16px;font-size:15px;margin:0 4px;background:#3D434A;color:#fff}
#rec button.sec{background:#E6E8EA;color:#2B3036}
#ent{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#2B3036;color:#fff;font-family:Arial,sans-serif;z-index:8;padding:24px;text-align:center}
#ent img{width:84px;height:84px;border-radius:18px}
#ent h1{font-size:19px;margin:14px 0 4px}
#ent p{color:#C3C8CE;font-size:14px;margin:0 0 22px}
#ent a{color:#C3C8CE;font-size:13px;margin-top:22px;text-decoration:underline;cursor:pointer}
#ent .err{color:#F2B8B5;margin-top:14px;font-size:13px}
#carga p{margin-top:14px;font-size:14px;color:#C3C8CE}
</style>
</head>
<body>
<div id="carga"><img src="https://lh3.googleusercontent.com/d/1WB5Ua2w2fk9815wBQfZxvhCiECnHW1lG" alt="CEV"><p>Consultora Estructural Vanegas</p></div>
<div id="ent"><img src="https://lh3.googleusercontent.com/d/1WB5Ua2w2fk9815wBQfZxvhCiECnHW1lG" alt="CEV"><h1>Consultora Estructural Vanegas</h1><p>Ingrese con su cuenta de Gmail</p><div id="gbtn"></div><div class="err" id="ent_e"></div><a id="ent_cod">Entrar con código por correo</a></div>
<div id="rec"><div>🎙 Grabando nota de voz<b id="rec_t">0:00</b><button id="rec_ok">Detener y adjuntar</button><button class="sec" id="rec_no">Cancelar</button></div></div>
<iframe id="portal" src="https://script.google.com/macros/s/AKfycbyb73VD01eKQsynWj-roJF3xrOKwsHJFNc1DpuXTqOGumnqD2CXTyji4VryBsSvDdtrgA/exec" allow="clipboard-write; microphone" title="Portal CEV"></iframe>
<script>
document.getElementById('portal').addEventListener('load', function () { var c = document.getElementById('carga'); c.style.opacity = 0; setTimeout(function () { c.remove(); }, 450); });
// Sesión y "Continuar con Google": este dominio (github.io) está autorizado en Google Cloud; el portal (iframe) no.
var CLIENT_ID = '231180581270-kdhf85ag2eo50bjfqhhrnrvc8r40htgr.apps.googleusercontent.com', PORTAL = null, GIS = false;
function guardado() { try { return localStorage.getItem('cev_token') || ''; } catch (e) { return ''; } }
function mostrarEntrada() {
  document.getElementById('ent').style.display = 'flex';
  if (GIS) return; GIS = true;
  var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = function () {
    google.accounts.id.initialize({ client_id: CLIENT_ID, auto_select: true, cancel_on_tap_outside: false, itp_support: true,
      callback: function (r) { document.getElementById('ent_e').textContent = 'Verificando…'; if (PORTAL) PORTAL.postMessage({ cev: 'credencial', t: r.credential }, '*'); } });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'filled_white', size: 'large', shape: 'pill', text: 'continue_with', locale: 'es', width: 280 });
    google.accounts.id.prompt();
  };
  document.head.appendChild(s);
}
document.getElementById('ent_cod').onclick = function () { document.getElementById('ent').style.display = 'none'; if (PORTAL) PORTAL.postMessage({ cev: 'usarCodigo' }, '*'); };
window.addEventListener('message', function (ev) {
  var m = ev.data || {}; if (!m.cev) return;
  if (m.cev === 'pideSesion') { PORTAL = ev.source; PORTAL.postMessage({ cev: 'sesionGuardada', token: guardado() }, '*'); }
  else if (m.cev === 'login') { PORTAL = ev.source; mostrarEntrada(); }
  else if (m.cev === 'sesion') { try { m.token ? localStorage.setItem('cev_token', m.token) : localStorage.removeItem('cev_token'); } catch (e) { }
    if (m.token) { document.getElementById('ent').style.display = 'none'; document.getElementById('ent_e').textContent = ''; }
    else if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); }
  else if (m.cev === 'loginError') document.getElementById('ent_e').textContent = m.msg || 'No se pudo ingresar.';
});
// Nota de voz: el portal (iframe) pide grabar; aquí sí hay permiso de micrófono. El audio vuelve al portal por postMessage.
window.addEventListener('message', function (ev) {
  if (!ev.data || ev.data.cev !== 'grabar') return;
  var fuente = ev.source; fuente.postMessage({ cev: 'listo' }, '*');
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
    var rec = new MediaRecorder(st), partes = [], cancelado = false, t0 = Date.now(), caja = document.getElementById('rec');
    var reloj = setInterval(function () { var s = Math.round((Date.now() - t0) / 1000); document.getElementById('rec_t').textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }, 500);
    rec.ondataavailable = function (e) { partes.push(e.data); };
    rec.onstop = function () {
      clearInterval(reloj); caja.style.display = 'none'; st.getTracks().forEach(function (t) { t.stop(); });
      if (cancelado) return;
      var mime = rec.mimeType || 'audio/webm', fr = new FileReader();
      fr.onload = function () { fuente.postMessage({ cev: 'audio', mime: mime, b64: String(fr.result).split(',')[1] }, '*'); };
      fr.readAsDataURL(new Blob(partes, { type: mime }));
    };
    document.getElementById('rec_ok').onclick = function () { rec.stop(); };
    document.getElementById('rec_no').onclick = function () { cancelado = true; rec.stop(); };
    document.getElementById('rec_t').textContent = '0:00'; caja.style.display = 'flex'; rec.start();
  }).catch(function () { alert('No se pudo usar el micrófono. Revise el permiso de micrófono para esta app.'); });
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
